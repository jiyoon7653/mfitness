<style id="sync-style">
  #sync-badge{position:fixed;right:14px;bottom:14px;z-index:9999;max-width:min(340px,calc(100vw - 28px));
    padding:8px 12px;border-radius:999px;border:1px solid var(--border,#DBDFE6);background:var(--surface,#fff);
    color:var(--ink-muted,#5B6472);font:500 12px/1.4 'Noto Sans KR',Arial,sans-serif;
    box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;gap:7px;align-items:center;}
  #sync-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
  #sync-badge.saved{color:var(--success,#3F8F5F);}
  #sync-badge.saving{color:var(--warn,#C77D22);}
  #sync-badge.error{color:var(--danger,#C1443A);border-color:var(--danger,#C1443A);}
  #sync-badge.remote{color:var(--warn,#C77D22);border-color:var(--warn,#C77D22);cursor:pointer;}
  @media print{#sync-badge{display:none;}}
</style>

<style id="app-style">
  :root{
    --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#1B2430; --ink-muted:#5B6472;
    --border:#DBDFE6; --accent:#2F6F5E; --accent-strong:#1F5346; --accent-bg:#E7F0EC;
    --warn:#C77D22; --warn-bg:#FBEEDD; --danger:#C1443A; --danger-bg:#FBEAE8; --success:#3F8F5F; --success-bg:#E9F5EE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161B; --surface:#1B2129; --surface-2:#222A33; --ink:#E9ECEF; --ink-muted:#9AA4B0;
      --border:#2B333D; --accent:#4FBFA0; --accent-strong:#7ED9C0; --accent-bg:#17332B;
      --warn:#E0A659; --warn-bg:#3A2C17; --danger:#E2685C; --danger-bg:#3A1E1C; --success:#6FCB94; --success-bg:#173328;

  }
  :root[data-theme="dark"]{
    --bg:#12161B; --surface:#1B2129; --surface-2:#222A33; --ink:#E9ECEF; --ink-muted:#9AA4B0;
    --border:#2B333D; --accent:#4FBFA0; --accent-strong:#7ED9C0; --accent-bg:#17332B;
    --warn:#E0A659; --warn-bg:#3A2C17; --danger:#E2685C; --danger-bg:#3A1E1C; --success:#6FCB94; --success-bg:#173328;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',Arial,sans-serif;font-size:14px;line-height:1.5;}

  h1,h2,h3{font-family:'Sora','Noto Sans KR',Arial,sans-serif;letter-spacing:-0.01em;text-wrap:balance;margin:0 0 4px;}
  h1{font-size:22px;font-weight:700;}
  h2{font-size:17px;font-weight:700;}
  h3{font-size:14px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .row.between{justify-content:space-between;}
  .col{display:flex;flex-direction:column;gap:6px;}

  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  input[type="number"]{font-family:'JetBrains Mono',monospace;}

  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--border);font-size:13px;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--ink-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  .table-wrap{overflow-x:auto;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .pill-draft{background:var(--surface-2);color:var(--ink-muted);}
  .pill-submitted{background:var(--warn-bg);color:var(--warn);}
  .pill-confirmed{background:var(--success-bg);color:var(--success);}
  .kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;}
  .kv .k{color:var(--ink-muted);font-size:13px;}
  .kv .v{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;width:fit-content;}
  .tab{padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-muted);}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .error{color:var(--danger);font-size:13px;}
  .note{font-size:12px;color:var(--ink-muted);background:var(--surface-2);border-radius:9px;padding:10px 12px;}
  a.linklike{color:var(--accent);cursor:pointer;font-weight:600;font-size:13px;}
  .center{display:flex;align-items:center;justify-content:center;min-height:70vh;}
  .login-card{width:100%;max-width:380px;}
  .emp-pick{display:flex;flex-wrap:wrap;gap:8px;}
  .emp-pick button{flex:1;min-width:90px;}
  .emp-pick button.selected{background:var(--accent);color:#fff;}
  ::placeholder{color:var(--ink-muted);opacity:.7;}

  /* 급여명세서 인쇄(PDF 저장)용 — 화면에서는 안 보이고 인쇄할 때만 나옵니다. */

  @media print{
    body{background:#fff;}
    #app-root, #sync-badge{display:none !important;}
    #payslip{display:block;color:#000;font-size:12px;padding:0;}
    #payslip h1{font-size:20px;margin:0 0 4px;}

    #payslip table{width:100%;border-collapse:collapse;}
    #payslip th, #payslip td{border:1px solid #999;padding:5px 7px;font-size:11px;text-align:left;}
    #payslip th{background:#f0f0f0;}
    #payslip td.num{text-align:right;font-variant-numeric:tabular-nums;}
    #payslip .ps-total{margin-top:14px;border-top:2px solid #000;padding-top:8px;
      display:flex;justify-content:space-between;font-size:15px;font-weight:700;}
    #payslip .ps-foot{margin-top:26px;font-size:11px;color:#444;}
    @page{margin:16mm;}
  }

<script id="app-script">
(function(){
  "use strict";
  // 아래 app-state 값은 서버(Firestore)에 데이터가 아직 없을 때 한 번만 쓰이는 초기값입니다.
  // 실제 데이터는 Firestore 문서 payroll/state 에 누적됩니다.
  var STATE = JSON.parse(document.getElementById('app-state').textContent);

  var db = null, STATE_REF = null;
  var CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var baseRev = 0;      // 지금 화면이 들고 있는 데이터의 서버 리비전
  var booted = false;   // 첫 로딩 완료 여부

  var UI ={ session: null, adminTab: 'list', month: currentMonthKey(), openEmployeeId: null, err: '', pinChange: false };
  var DRAFT = {}; // local unsaved edit buffers, keyed by employeeId

  var ROLE_LABEL = { manager: '매니저', trainer: '트레이너', info: '인포 아르바이트' };
  var CATEGORY_OPTS = ['신규','재등록','인계','지인','소개'];
  // 고범수(매니저) 등록 분류별 수업료율 - 매출 금액과 무관하게 분류로만 결정
  var CATEGORY_RATE = { '신규':0.45, '재등록':0.55, '인계':0.50, '지인':0.50, '소개':0.50 };
  function categoryRate(cat){ return CATEGORY_RATE.hasOwnProperty(cat) ? CATEGORY_RATE[cat] : 1; }

  // 이새한(트레이너) 당월 총매출 구간별 수업료율 - 700만원까지는 구간 요율, 초과분은 요율 고정(55%) + 초과분의 10% 별도 인센티브
  function trainerRateForRevenue(rev){
    if (rev <= 2990000) return 0.30;
    if (rev <= 3990000) return 0.45;
    if (rev <= 4990000) return 0.50;
    return 0.55; // 500만~699만 및 700만 초과 구간 모두 요율은 55%로 고정, 700만 초과분만 별도 10% 인센티브
  }

  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function fmt(n){
    n = Math.round(n||0);
    return n.toLocaleString('ko-KR');
  }
  function won(n){ return fmt(n) + '원'; }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  async function sha256(text){
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  function findEmployee(id){
    for (var i=0;i<STATE.employees.length;i++){ if (STATE.employees[i].id===id) return STATE.employees[i]; }
    return null;
  }

  function ensureMonth(monthKey){
    if (!STATE.months[monthKey]) STATE.months[monthKey] = {};
    var m = STATE.months[monthKey];
    STATE.employees.forEach(function(emp){
      if (!m[emp.id]){
        if (emp.role === 'info'){
          m[emp.id] = { status:'draft', holidays:'', absentDays:0, submittedAt:null, confirmedAt:null, hourlyWage: emp.hourlyWage, pensionRateSelf:4.75, healthRateTotal:7.19, careRateTotal:0.9448 };
        } else {
          m[emp.id] = { status:'draft', sessions:[], supportAmount: emp.supportAmount||0, deductionRate: emp.deductionRate||3.3, submittedAt:null, confirmedAt:null };
          if (emp.role === 'manager') m[emp.id].baseSalary = emp.baseSalary || 0;
        }
      }
    });
    return m;
  }

  function countWeekdays(year, month){ // month: 1-12
    var days = new Date(year, month, 0).getDate();
    var c = 0;
    for (var d=1; d<=days; d++){
      var wd = new Date(year, month-1, d).getDay();
      if (wd>=1 && wd<=5) c++;
    }
    return c;
  }

  function pad2(n){ return (n<10?'0':'')+n; }

  function parseDateList(str){
    if (!str) return [];
    return String(str).split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  }

  // Mon-Fri 근무 주 단위로 그룹핑 (해당 월에 속하는 평일만 포함, 월 경계에 걸친 주는 부분 주로 표시)
  function weeksOfMonth(year, month){
    var totalDays = new Date(year, month, 0).getDate();
    var weeks = [], currentKey = null, current = null;
    for (var d=1; d<=totalDays; d++){
      var dt = new Date(year, month-1, d);
      var wd = dt.getDay();
      if (wd>=1 && wd<=5){
        var monday = new Date(dt); monday.setDate(dt.getDate()-(wd-1));
        var key = monday.getFullYear()+'-'+pad2(monday.getMonth()+1)+'-'+pad2(monday.getDate());
        if (key!==currentKey){ currentKey=key; current={key:key, dates:[]}; weeks.push(current); }
        current.dates.push(year+'-'+pad2(month)+'-'+pad2(d));
      }
    }
    return weeks;
  }

  function calcSessionRow(row){
    var contract = Number(row.contractSessions)||0;
    var totalPaid = Number(row.totalPaid)||0;
    var prev = Number(row.prevDone)||0;
    var thisMonth = Number(row.thisMonthDone)||0;
    var unit = contract>0 ? Math.round(totalPaid/contract) : 0;
    var remaining = contract - (prev+thisMonth);
    var grossFee = unit*thisMonth; // 카테고리/구간 요율 적용 전 매출(100% 기준) — 트레이너 표시용
    return {unit:unit, remaining:remaining, grossFee:grossFee};
  }

  // ---------- 고범수(매니저) 정산 ----------
  // 급여 = ① 수업료 + ② 기본급 + ③ 매출 인센티브. 세 항목은 서로 완전히 독립입니다.
  //
  // ① 수업료: 회원 한 명마다
  //      회당단가 = 결제금액 ÷ 계약세션 × 분류별 요율
  //      합산 수업료 = 회당단가 × 금월진행횟수
  //    를 구해 전부 더합니다.
  // ③ 매출 인센티브: 운영 보드와는 전혀 연동하지 않고 직접 입력한 매출을 기준으로,
  //    구간 요율을 찾아 (매출 − 부가세 10%) × 요율 로 자동 계산합니다.
  function managerRowCalc(row){
    var contract = Number(row.contractSessions)||0;
    var paid = Number(row.totalPaid)||0;
    var prev = Number(row.prevDone)||0;
    var thisMonth = Number(row.thisMonthDone)||0;
    var rate = categoryRate(row.category);
    var unitFee = contract>0 ? Math.round(paid/contract*rate) : 0;   // 회당단가
    return {rate:rate, remaining:contract-(prev+thisMonth), unitFee:unitFee, fee:unitFee*thisMonth};
  }

  function managerBracketRate(emp, revenue){
    var brackets = (emp.brackets||[]).slice().sort(function(a,b){return a[0]-b[0];});
    var rate = 0;
    brackets.forEach(function(b){ if (revenue >= b[0]) rate = b[1]; });
    return rate;
  }

  function calcManagerTotals(emp, monthData){
    var feeTotal = 0;
    (monthData.sessions||[]).forEach(function(row){ feeTotal += managerRowCalc(row).fee; });

    var baseSalary = Number(monthData.baseSalary)||0;

    var revenue = Number(monthData.incentiveRevenue)||0;   // 직접 입력값
    var rate = managerBracketRate(emp, revenue);
    var revenueExVat = Math.round(revenue * 0.9);
    var incentive = Math.round(revenueExVat * rate/100);

    var preTax = feeTotal + baseSalary + incentive;
    var dRate = monthData.deductionRate==null ? 3.3 : Number(monthData.deductionRate);
    var deduction = Math.round(preTax*dRate/100);
    return {feeTotal:feeTotal, baseSalary:baseSalary, revenue:revenue, rate:rate,
            revenueExVat:revenueExVat, incentive:incentive,
            preTax:preTax, deductionRate:dRate, deduction:deduction, net:preTax-deduction};
  }

  // 이새한(트레이너): 당월 총매출 합계 기준 구간 요율을 매출 전체에 일괄 적용.
  // 총매출은 회원별 진행 페이스(단가×이번달횟수)가 아니라, 그달 실제로 결제받은 금액(totalPaid)의 합계입니다.
  // 700만원 초과분에 대해서는 요율은 55%로 고정하되, 초과분의 10%를 별도 인센티브로 추가 지급(100만원당 10만원).
  function calcTrainerTotals(monthData){
    var grossRevenue = 0;
    (monthData.sessions||[]).forEach(function(row){ grossRevenue += Number(row.totalPaid)||0; });
    var rate = trainerRateForRevenue(grossRevenue);
    var baseFee = Math.round(grossRevenue * rate);
    var excess = Math.max(0, grossRevenue - 7000000);
    var excessIncentive = Math.round(excess * 0.10);
    var totalFee = baseFee + excessIncentive;
    var support = Number(monthData.supportAmount)||0;
    var preTax = totalFee + support;
    var rateD = monthData.deductionRate==null ? 3.3 : Number(monthData.deductionRate);
    var deduction = Math.round(preTax*rateD/100);
    var net = preTax - deduction;
    return {grossRevenue:grossRevenue, rate:rate, baseFee:baseFee, excess:excess, excessIncentive:excessIncentive, totalFee:totalFee, support:support, preTax:preTax, deductionRate:rateD, deduction:deduction, net:net};
  }

  // 최민영(인포): 월~금 19-22시(일 3시간) 고정 스케줄. 공휴일이 하루라도 포함된 주는 그 주의 주휴수당을 지급하지 않음.
  function calcInfoTotals(monthKey, monthData){
    var parts = monthKey.split('-').map(Number);
    var year = parts[0], month = parts[1];
    var weekdayCount = countWeekdays(year, month);
    var holidays = parseDateList(monthData.holidays);
    var holidaySet = {};
    holidays.forEach(function(h){ holidaySet[h] = true; });
    var absentDays = Number(monthData.absentDays)||0;
    var actualDays = Math.max(0, weekdayCount - holidays.length - absentDays);
    var wage = Number(monthData.hourlyWage)||0;
    var basePay = actualDays*3*wage;
    var baseRestWeeks = Math.floor(actualDays/5);
    var weeks = weeksOfMonth(year, month);
    var holidayWeeks = 0;
    weeks.forEach(function(w){
      if (w.dates.some(function(d){ return holidaySet[d]; })) holidayWeeks++;
    });
    var restWeeks = Math.max(0, baseRestWeeks - holidayWeeks);
    var restPay = restWeeks*3*wage;
    var preTax = basePay+restPay;

    // 최민영(인포)은 사업소득 3.3%가 아니라 4대보험 가입자입니다.
    // 다만 다른 직장이 주된 근무지라 고용보험은 그쪽에서 들고 있어 여기서는 빼고,
    // 국민연금 · 건강보험 · 장기요양보험 3가지만 공제합니다.
    // (산재보험은 전액 사업주 부담이라 급여에서 공제하지 않습니다.)
    // 요율은 해마다 바뀌므로 관리자 화면에서 직접 고칠 수 있게 해 두었습니다.
    // 요율 입력은 세무사가 주는 고시 요율 표기를 그대로 씁니다.
    //  · 국민연금은 관행대로 "본인부담률"(총 9.5% 중 절반인 4.75%)을 그대로 입력
    //  · 건강보험 · 장기요양은 고시되는 "노사 합산 총 요율"을 입력하고 절반만 공제
    // 장기요양은 보수 대비 총 요율(0.9448%)로 계산합니다
    // (건강보험료 대비 13.14%와 같은 값: 7.19% × 13.14% = 0.9448%).
    var pensionRate = monthData.pensionRateSelf==null ? 4.75 : Number(monthData.pensionRateSelf);
    var healthTotal = monthData.healthRateTotal==null ? 7.19 : Number(monthData.healthRateTotal);
    var careTotal   = monthData.careRateTotal==null ? 0.9448 : Number(monthData.careRateTotal);
    var healthRate  = healthTotal/2;   // 본인부담률
    var careRate    = careTotal/2;     // 본인부담률
    var pension = Math.round(preTax*pensionRate/100);
    var health  = Math.round(preTax*healthRate/100);
    var care    = Math.round(preTax*careRate/100);
    var deduction = pension + health + care;
    var net = preTax-deduction;
    return {weekdayCount:weekdayCount, holidayCount:holidays.length, holidayWeeks:holidayWeeks,
            actualDays:actualDays, basePay:basePay, restWeeks:restWeeks, restPay:restPay, preTax:preTax,
            pensionRate:pensionRate, healthTotal:healthTotal, careTotal:careTotal,
            healthRate:healthRate, careRate:careRate,
            pension:pension, health:health, care:care,
            deduction:deduction, net:net};
  }

  // 인포(4대보험 중 3대보험) 공제 내역 표시 — 고시 요율과 실제 본인부담률을 함께 보여줍니다.
  function insuranceLabels(t){
    return {
      pension: '국민연금 (본인부담 '+t.pensionRate+'%)',
      health:  '건강보험 (총 '+t.healthTotal+'% 중 본인부담 '+t.healthRate+'%)',
      care:    '장기요양보험 (총 '+t.careTotal+'% 중 본인부담 '+t.careRate+'%)'
    };
  }

  function insuranceKv(t){
    var L = insuranceLabels(t);
    return '<div class="kv"><div class="k" id="k-if-pension">'+L.pension+'</div><div class="v" id="v-if-pension">-'+won(t.pension)+'</div></div>' +
      '<div class="kv"><div class="k" id="k-if-health">'+L.health+'</div><div class="v" id="v-if-health">-'+won(t.health)+'</div></div>' +
      '<div class="kv"><div class="k" id="k-if-care">'+L.care+'</div><div class="v" id="v-if-care">-'+won(t.care)+'</div></div>' +
      '<p class="muted" style="margin:4px 0 0">건강보험·장기요양은 노사가 절반씩 부담하므로 고시 총 요율의 1/2만 공제합니다. 고용보험은 기존 직장에서 가입되어 있어 제외하고, 산재보험은 전액 사업주 부담입니다.</p>';
  }

  // ---------- 저장 상태 표시 ----------
  function setSync(kind, text){
    var el = document.getElementById('sync-badge');
    if (!el){
      el = document.createElement('div');
      el.id = 'sync-badge';
      document.body.appendChild(el);
    }
    el.className = kind || '';
    el.textContent = text;
    el.onclick = kind === 'remote' ? function(){ location.reload(); } : null;
  }

  // ---------- Firestore 저장 ----------
  // 문서 하나에 전체 상태를 JSON 문자열로 저장합니다.
  // (직원별 요율표 brackets 가 중첩 배열이라 Firestore 필드로는 직접 저장할 수 없습니다.)
  var CONFLICT = { conflict: true };

  function saveState(){
    if (!STATE_REF){
      setSync('error', '서버에 연결되지 않아 저장하지 못했습니다.');
      return Promise.resolve(false);
    }
    setSync('saving', '저장 중…');
    var payload = JSON.stringify(STATE);
    return db.runTransaction(function (tx){
      return tx.get(STATE_REF).then(function (doc){
        if (doc.exists){
          var d = doc.data() || {};
          // 내가 화면에 띄운 이후 다른 사람이 먼저 저장했다면 덮어쓰지 않습니다.
          if (Number(d.rev) > baseRev && d.client !== CLIENT_ID) throw CONFLICT;
        }
        var rev = Date.now();
        tx.set(STATE_REF, { data: payload, rev: rev, client: CLIENT_ID, updatedAt: rev });
        return rev;
      });
    }).then(function (rev){
      baseRev = rev;
      setSync('saved', '저장됨 · ' + new Date(rev).toLocaleTimeString('ko-KR'));
      return true;
    }).catch(function (err){
      if (err === CONFLICT){
        setSync('remote', '다른 사람이 먼저 저장했습니다. 눌러서 새로고침 후 다시 입력해 주세요.');
      } else {
        setSync('error', '저장 실패: ' + ((err && err.message) || '알 수 없는 오류'));
      }
      return false;
    });
  }

  function persist(){
    render();
    return saveState();
  }

  // ---------- 서버 연결 ----------
  // firebase-config.js 를 어떤 형태로 채웠든 설정값을 찾아냅니다.
  function findFirebaseConfig() {
    if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId) return window.FIREBASE_CONFIG;
    if (window.firebaseConfig && window.firebaseConfig.projectId) return window.firebaseConfig;
    try {
      if (typeof firebaseConfig !== 'undefined' && firebaseConfig && firebaseConfig.projectId) return firebaseConfig;
    } catch (e) {}
    return null;
  }

  function configProblem() {
    if (findFirebaseConfig()) return null;
    if (!window.__CONFIG_FILE_LOADED) {
      return 'firebase-config.js 파일을 찾지 못했습니다. index.html 과 같은 폴더에 함께 올렸는지, 파일 이름이 정확한지 확인해 주세요.';
    }
    return 'firebase-config.js 안의 값이 아직 비어 있습니다. Firebase 콘솔 → 프로젝트 설정 → 내 앱 의 값을 따옴표 안에 넣고 파일을 다시 올려 주세요.';
  }

  function connect(){
    if (typeof firebase === 'undefined'){
      setSync('error', 'Firebase 스크립트를 불러오지 못했습니다. 네트워크를 확인해 주세요.');
      startOffline();
      return;
    }
    var problem = configProblem();
    if (problem){
      setSync('error', problem);
      startOffline();
      return;
    }

    setSync('saving', '연결 중…');
    firebase.initializeApp(findFirebaseConfig());

    firebase.auth().signInAnonymously().then(function (){
      db = firebase.firestore();
      STATE_REF = db.doc('payroll/state');

      STATE_REF.onSnapshot(function (snap){
        if (!snap.exists){
          // 서버가 비어 있으면 지금 들고 있는 초기값으로 한 번 채웁니다.
          if (!booted){ booted = true; UI.loginTab = 'employee'; render(); saveState(); }
          return;
        }
        var d = snap.data() || {};
        var incoming;
        try { incoming = JSON.parse(d.data); } catch (e){ return; }

        if (!booted){
          booted = true;
          STATE = incoming;
          baseRev = Number(d.rev) || 0;
          UI.loginTab = 'employee';
          render();
          setSync('saved', '최신 데이터를 불러왔습니다.');
          return;
        }
        if (d.client === CLIENT_ID) return;          // 내가 방금 저장한 내용

        if (UI.session){
          // 누군가 입력 중인 화면을 덮어쓰지 않습니다. 새로고침은 본인이 결정.
          setSync('remote', '다른 기기에서 변경됨 · 눌러서 새로고침');
        } else {
          STATE = incoming;
          baseRev = Number(d.rev) || 0;
          render();
          setSync('saved', '최신 데이터를 불러왔습니다.');
        }
      }, function (err){
        setSync('error', '동기화 오류: ' + ((err && err.message) || '알 수 없는 오류'));
      });
    }).catch(function (err){
      setSync('error', '서버 연결 실패: ' + ((err && err.message) || '알 수 없는 오류'));
      startOffline();
    });
  }

  // 서버에 붙지 못했을 때: 화면은 뜨지만 저장은 되지 않는다는 것을 분명히 알립니다.
  function startOffline(){
    if (booted) return;
    booted = true;
    UI.loginTab = 'employee';
    render();
  }

  // ---------- 입력 중 부분 갱신 ----------
  // 숫자 칸은 커서 위치를 읽을 수 없어, 입력 중에 화면을 통째로 다시 그리면 커서가 맨 앞으로 튑니다.
  // 그래서 입력 중에는 계산 결과 숫자만 제자리에서 바꿔 씁니다.
  function setText(id, text){ var el = document.getElementById(id); if (el) el.textContent = text; }
  function setHtml(id, html){ var el = document.getElementById(id); if (el) el.innerHTML = html; }
  function showRow(id, on){ var el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; }
  function setCell(i, name, text){
    var el = document.querySelector('[data-calc="'+name+'"][data-i="'+i+'"]');
    if (el) el.textContent = text;
  }

  // 매니저 화면: 입력할 때마다 다시 그리지 않고 계산 결과 칸만 갱신합니다
  // (한글 입력 중에 화면을 다시 그리면 글자가 깨지기 때문).
  function refreshManagerTotals(emp, m){
    var t = calcManagerTotals(emp, m);
    (m.sessions||[]).forEach(function(row, i){
      var c = managerRowCalc(row);
      setCell(i, 'remaining', fmt(c.remaining));
      setCell(i, 'rate', Math.round(c.rate*100)+'%');
      setCell(i, 'unit', won(c.unitFee));
      setCell(i, 'fee', won(c.fee));
    });
    setText('v-mg-fee-total', won(t.feeTotal));
    setText('v-mg-base', won(t.baseSalary));
    setText('v-mg-rate', t.rate+'%');
    setText('v-mg-exvat', won(t.revenueExVat));
    setText('k-mg-inc', '매출 인센티브 (부가세 제외 매출 × '+t.rate+'%)');
    setText('v-mg-inc', won(t.incentive));
    setText('v-mg-sum-fee', won(t.feeTotal));
    setText('v-mg-sum-base', won(t.baseSalary));
    setText('v-mg-sum-inc', won(t.incentive));
    setText('v-sum-pre', won(t.preTax));
    setText('k-sum-ded', '공제액 ('+t.deductionRate+'%)');
    setText('v-sum-ded', '-'+won(t.deduction));
    setText('v-sum-net', won(t.net));
  }

  // 트레이너(이새한) 화면 전용
  function refreshSessionTotals(emp, m){
    var buf = DRAFT[emp.id] || m.sessions || [];
    var totals = calcTrainerTotals({sessions:buf});
    buf.forEach(function(row, i){
      var c = calcSessionRow(row);
      setCell(i, 'unit', fmt(c.unit));
      setCell(i, 'remaining', fmt(c.remaining));
      setCell(i, 'gross', won(c.grossFee));
      setCell(i, 'rate', Math.round(totals.rate*100)+'%');
      setCell(i, 'fee', won(Math.round(c.grossFee*totals.rate)));
    });
    setText('v-total-fee', won(totals.totalFee));
    setText('v-tr-gross', won(totals.grossRevenue));
    setText('v-tr-rate', Math.round(totals.rate*100)+'%');
    showRow('kv-tr-excess', totals.excess > 0);
    setText('v-tr-excess', won(totals.excessIncentive));
  }

  function refreshInfoTotals(emp, buf, monthKey){
    var t = calcInfoTotals(monthKey, buf);
    setText('v-if-weekday', t.weekdayCount+'일');
    setText('v-if-actual', t.actualDays+'일');
    setText('v-if-base', won(t.basePay));
    showRow('kv-if-hw', t.holidayWeeks > 0);
    setText('v-if-hw', t.holidayWeeks+'주');
    setText('k-if-rest', '주휴수당 ('+t.restWeeks+'주)');
    setText('v-if-rest', won(t.restPay));
    refreshInsuranceKv(t);
  }

  function refreshInsuranceKv(t){
    var L = insuranceLabels(t);
    setText('k-if-pension', L.pension);
    setText('v-if-pension', '-'+won(t.pension));
    setText('k-if-health', L.health);
    setText('v-if-health', '-'+won(t.health));
    setText('k-if-care', L.care);
    setText('v-if-care', '-'+won(t.care));
    setText('v-sum-pre', won(t.preTax));
    setText('v-sum-ded', '-'+won(t.deduction));
    setText('v-sum-net', won(t.net));
  }

  // 트레이너/인포 관리자 화면 전용 (매니저는 refreshManagerTotals 를 씁니다)
  function refreshAdminTotals(emp, m){
    var t = emp.role==='trainer' ? calcTrainerTotals(m) : calcInfoTotals(UI.month, m);
    if (emp.role==='info'){
      setText('v-ad-if-base', won(t.basePay));
      setText('v-ad-if-rest', won(t.restPay));
      refreshInsuranceKv(t);
      return;
    }
    setText('v-sum-pre', won(t.preTax));
    setText('k-sum-ded', '공제액 ('+t.deductionRate+'%)');
    setText('v-sum-ded', '-'+won(t.deduction));
    setText('v-sum-net', won(t.net));
  }

  // ---------- render ----------
  // 입력 중에 화면을 다시 그려도 커서가 빠지지 않게, 보고 있던 칸으로 포커스를 되돌립니다.
  function renderKeepFocus(){
    var el = document.activeElement;
    var byId = el && el.id ? el.id : null;
    var di = el && el.getAttribute ? el.getAttribute('data-i') : null;
    var df = el && el.getAttribute ? el.getAttribute('data-f') : null;
    var start = null, end = null;
    try { start = el.selectionStart; end = el.selectionEnd; } catch (e) {}

    render();

    var next = null;
    if (byId) next = document.getElementById(byId);
    else if (di !== null && df !== null) next = document.querySelector('[data-i="'+di+'"][data-f="'+df+'"]');
    if (next){
      try { next.focus(); } catch (e) {}
      try { if (start !== null) next.setSelectionRange(start, end); } catch (e) {}
    }
  }

  function render(){
    var root = document.getElementById('app-root');
    if (!UI.session) { root.innerHTML = renderLogin(); bindLogin(); return; }
    if (UI.session.type === 'admin') { root.innerHTML = renderAdmin(); bindAdmin(); return; }
    root.innerHTML = renderEmployee(); bindEmployee();
  }

  function renderLogin(){
    var active = STATE.employees.filter(function(e){return e.active;});
    return '' +
    '<div class="center"><div class="card login-card">' +
      '<h1>M휘트니스 급여 정산</h1>' +
      '<p class="muted" style="margin-top:0">본인 이름과 PIN으로 로그인하세요.</p>' +
      '<div class="tabs" id="login-tabs" style="margin-bottom:16px">' +
        '<div class="tab' + (UI.loginTab!=='admin'?' active':'') + '" data-tab="employee">직원</div>' +
        '<div class="tab' + (UI.loginTab==='admin'?' active':'') + '" data-tab="admin">관리자</div>' +
      '</div>' +
      (UI.loginTab==='admin' ? renderAdminLogin() : renderEmployeeLogin(active)) +
      (UI.err ? '<p class="error" style="margin-top:10px">'+esc(UI.err)+'</p>' : '') +
    '</div></div>';
  }

  function renderEmployeeLogin(active){
    return '' +
      '<div class="col">' +
        '<label>이름 선택</label>' +
        '<div class="emp-pick">' + active.map(function(e){
          return '<button type="button" class="btn-ghost' + (UI.pickedEmp===e.id?' selected':'') + '" data-emp="'+e.id+'">'+esc(e.name)+'</button>';
        }).join('') + '</div>' +
        '<label style="margin-top:10px">PIN</label>' +
        '<input id="emp-pin" type="password" inputmode="numeric" placeholder="4자리 PIN">' +
        '<button class="btn-primary" id="emp-login-btn" style="margin-top:10px">로그인</button>' +
      '</div>';
  }
  function renderAdminLogin(){
    return '' +
      '<div class="col">' +
        '<label>관리자 PIN</label>' +
        '<input id="admin-pin" type="password" inputmode="numeric" placeholder="관리자 PIN">' +
        '<button class="btn-primary" id="admin-login-btn" style="margin-top:10px">로그인</button>' +
      '</div>';
  }

  function bindLogin(){
    var tabs = document.getElementById('login-tabs');
    tabs.querySelectorAll('.tab').forEach(function(t){
      t.onclick = function(){ UI.loginTab = t.getAttribute('data-tab'); UI.err=''; render(); };
    });
    if (UI.loginTab==='admin'){
      document.getElementById('admin-login-btn').onclick = async function(){
        var pin = document.getElementById('admin-pin').value.trim();
        var h = await sha256(pin);
        if (h === STATE.adminPinHash){ UI.session = {type:'admin'}; UI.err=''; render(); }
        else { UI.err = 'PIN이 올바르지 않습니다.'; render(); }
      };
    } else {
      document.querySelectorAll('[data-emp]').forEach(function(b){
        b.onclick = function(){ UI.pickedEmp = b.getAttribute('data-emp'); render(); };
      });
      document.getElementById('emp-login-btn').onclick = async function(){
        if (!UI.pickedEmp){ UI.err='이름을 선택하세요.'; render(); return; }
        var pin = document.getElementById('emp-pin').value.trim();
        var emp = findEmployee(UI.pickedEmp);
        var h = await sha256(pin);
        if (emp && h === emp.pinHash){ UI.session = {type:'employee', id:emp.id}; UI.err=''; render(); }
        else { UI.err = 'PIN이 올바르지 않습니다.'; render(); }
      };
    }
  }

  function logout(){ UI.session=null; UI.pickedEmp=null; UI.err=''; UI.pinChange=false; UI.loginTab='employee'; DRAFT={}; render(); }

  function statusLabel(status){
    return status==='confirmed' ? '확정됨' : (status==='submitted' ? '제출됨' : '미제출');
  }
  function statusPill(status){
    var cls = status==='confirmed' ? 'pill-confirmed' : (status==='submitted' ? 'pill-submitted' : 'pill-draft');
    return '<span class="pill '+cls+'">'+statusLabel(status)+'</span>';
  }

  // 제출(submitted) 이후에는 직원 화면이 잠깁니다. 관리자가 사유를 남기고
  // 재오픈해야만 다시 열립니다 — 제출 후 임의로 계속 고쳐 쓰는 것을 막기 위함입니다.
  function submittedNote(m){
    if (m.status !== 'submitted') return '';
    return '<p class="muted" style="margin:0 0 12px">제출 완료 · 관리자 확인 대기 중입니다. 확정되기 전까지 더 이상 수정할 수 없습니다. 고칠 내용이 있으면 관리자에게 재작성 요청을 부탁하세요.</p>';
  }
  function reopenNote(m){
    if (m.status !== 'draft') return '';
    var log = m.reopenLog;
    if (!log || !log.length) return '';
    var last = log[log.length-1];
    if (last.to !== 'draft') return '';
    return '<p class="muted" style="margin:0 0 12px;color:var(--accent-strong)">관리자가 재작성을 요청했습니다 ('+new Date(last.at).toLocaleString('ko-KR')+'): '+esc(last.reason)+'</p>';
  }

  // 해당 월에 실제로 입력된 내용이 있는지 (빈 껍데기 기록과 구분)
  function monthHasContent(k, empId){
    var mm = STATE.months[k];
    if (!mm) return false;
    if (empId){
      var r = mm[empId];
      if (!r) return false;
      if (r.status && r.status !== 'draft') return true;
      if (r.sessions && r.sessions.length) return true;
      if (r.holidays) return true;
      if (Number(r.absentDays) > 0) return true;
      if (r.baseSalary) return true;
      if (r.incentiveRevenue) return true;
      return false;
    }
    for (var i=0;i<STATE.employees.length;i++){
      if (monthHasContent(k, STATE.employees[i].id)) return true;
    }
    return false;
  }

  function monthStatusLabel(k, empId){
    if (!monthHasContent(k, empId)) return '';
    if (empId){
      var r = (STATE.months[k]||{})[empId] || {};
      if (r.status === 'confirmed') return ' · 확정';
      if (r.status === 'submitted') return ' · 제출';
      return ' · 작성중';
    }
    return ' · 기록';
  }

  // 지난 24개월 + 이번 달, 그리고 그 밖에 기록이 남아 있는 달까지 모두 선택할 수 있습니다.
  function selectableMonths(){
    var d = new Date(), keys = {};
    for (var i=0; i<24; i++){
      keys[d.getFullYear()+'-'+pad2(d.getMonth()+1)] = true;
      d.setMonth(d.getMonth()-1, 1);
    }
    keys[currentMonthKey()] = true;
    Object.keys(STATE.months).forEach(function(k){ keys[k] = true; });
    return Object.keys(keys).sort().reverse();
  }

      };

  function bindEmployee(){
    var emp = findEmployee(UI.session.id);
    var mRec = STATE.months[UI.month][emp.id];
    document.getElementById('logout-btn').onclick = logout;
    document.querySelectorAll('[data-open-month]').forEach(function(b){
      b.onclick = function(){ UI.month = b.getAttribute('data-open-month'); DRAFT={}; ensureMonth(UI.month); render(); };
    });
    document.getElementById('emp-month').onchange = function(e){ UI.month = e.target.value; DRAFT={}; ensureMonth(UI.month); render(); };
    document.getElementById('pin-change-toggle').onclick = function(){ UI.pinChange=!UI.pinChange; UI.pinErr=''; render(); };
    if (UI.pinChange){
      document.getElementById('pin-save-btn').onclick = async function(){
        var cur = document.getElementById('pin-cur').value.trim();
        var next = document.getElementById('pin-new').value.trim();
        var h = await sha256(cur);
        if (h !== emp.pinHash){ UI.pinErr='현재 PIN이 올바르지 않습니다.'; render(); return; }
        if (!next || next.length<4){ UI.pinErr='새 PIN은 4자리 이상으로 입력하세요.'; render(); return; }
        emp.pinHash = await sha256(next);
        UI.pinChange=false; UI.pinErr='';
        persist();
      };
    }
    ensureMonth(UI.month);
    var m = STATE.months[UI.month][emp.id];
    if (m.status==='confirmed' || m.status==='submitted') return;

    if (emp.role==='manager'){
      bindManagerPage(emp, m);
    } else if (emp.role==='info'){
      var buf = DRAFT[emp.id];
      var hEl = document.getElementById('info-holiday');
      var aEl = document.getElementById('info-absent');
      if (hEl) hEl.oninput = function(){ buf.holidays = hEl.value; refreshInfoTotals(emp, buf, UI.month); };
      if (aEl) aEl.oninput = function(){ buf.absentDays = Number(aEl.value)||0; refreshInfoTotals(emp, buf, UI.month); };
    } else {
      var buf2 = DRAFT[emp.id];
      document.querySelectorAll('#app-root tbody input, #app-root tbody select').forEach(function(el){
        el.oninput = el.onchange = function(){
          var i = Number(el.getAttribute('data-i'));
          var f = el.getAttribute('data-f');
          buf2[i][f] = el.value;
          refreshSessionTotals(emp, m);
        };
      });
      document.querySelectorAll('[data-del]').forEach(function(b){
        b.onclick = function(){ buf2.splice(Number(b.getAttribute('data-del')),1); render(); };
      });
      var addBtn = document.getElementById('add-row-btn');
      if (addBtn) addBtn.onclick = function(){ buf2.push({client:'',category:'신규',contractSessions:'',totalPaid:'',prevDone:'',thisMonthDone:''}); render(); };
    }

    var saveBtn = document.getElementById('save-draft-btn');
    var submitBtn = document.getElementById('submit-btn');
    if (saveBtn) saveBtn.onclick = function(){ commitDraft(emp, false); };
    if (submitBtn) submitBtn.onclick = function(){ commitDraft(emp, true); };
  }

  function commitDraft(emp, submit){
    ensureMonth(UI.month);
    var m = STATE.months[UI.month][emp.id];
    if (emp.role==='info'){
      var buf = DRAFT[emp.id] || m;
      m.holidays = buf.holidays || '';
      m.absentDays = Number(buf.absentDays)||0;
    } else {
      m.sessions = DRAFT[emp.id] || m.sessions || [];
    }
    if (submit){ m.status='submitted'; m.submittedAt = new Date().toISOString(); }
    persist();
  }

  // 관리자가 제출됨/확정됨 상태를 되돌릴 때는 반드시 사유를 남깁니다.
  // (직원이 제출 후 임의로 계속 고쳐 쓰지 못하게 잠가둔 대신, 정말 고쳐야 할 때는
  // 관리자가 이 사유와 함께 승인해야만 다시 열립니다.)
  function reopenWithReason(m, fromStatus, toStatus, extra){
    var reason = window.prompt('재오픈 사유를 입력해 주세요.'+(toStatus==='draft'?' (직원 화면에 표시됩니다)':''), '');
    if (reason === null) return false;
    reason = reason.trim();
    if (!reason){ window.alert('재오픈 사유를 입력해야 합니다.'); return false; }
    m.reopenLog = m.reopenLog || [];
    m.reopenLog.push({ at: new Date().toISOString(), from: fromStatus, to: toStatus, reason: reason });
    m.status = toStatus;
    if (extra) extra();
    persist();
    return true;
  }

      STATE.employees.forEach(function(emp){
        var m = STATE.months[k][emp.id];

  // ---------- 급여명세서 (확정된 달만, 관리자 전용) ----------

  // "PDF로 저장"을 고르면 그대로 PDF 파일로 내려받을 수 있습니다.
  function payslipRows(rows){
    return rows.map(function(r){
      return '<tr><td>'+esc(r[0])+'</td><td class="num">'+(r[1]<0?'-':'')+won(Math.abs(r[1]))+'</td></tr>';

  function buildPayslip(emp, m, monthKey){
    var pay = [], ded = [], t;
    if (emp.role==='manager'){
      t = calcManagerTotals(emp, m);
      pay.push(['① 수업료', t.feeTotal]);
      pay.push(['② 기본급', t.baseSalary]);
      pay.push(['③ 매출 인센티브 (매출 '+won(t.revenue)+' · 구간 '+t.rate+'%)', t.incentive]);
      ded.push(['사업소득 원천징수 ('+t.deductionRate+'%)', t.deduction]);
    } else if (emp.role==='trainer'){
      t = calcTrainerTotals(m);
      pay.push(['수업료 (당월 총매출 '+won(t.grossRevenue)+' · 요율 '+Math.round(t.rate*100)+'%)', t.baseFee]);
      if (t.excess>0) pay.push(['700만원 초과분 인센티브 (10%)', t.excessIncentive]);
      if (t.support) pay.push(['영업지원금', t.support]);
      ded.push(['사업소득 원천징수 ('+t.deductionRate+'%)', t.deduction]);
    } else {
      t = calcInfoTotals(monthKey, m);
      pay.push(['기본급 (실근무 '+t.actualDays+'일 × 3시간)', t.basePay]);
      pay.push(['주휴수당 ('+t.restWeeks+'주)', t.restPay]);
      var L = insuranceLabels(t);
      ded.push([L.pension, t.pension]);
      ded.push([L.health, t.health]);
      ded.push([L.care, t.care]);
    }

    var html = '';
    html += '<h1>급여명세서</h1>';
    html += '<p class="ps-sub">M휘트니스 · '+monthKey+' 귀속 · 발행일 '+new Date().toLocaleDateString('ko-KR')+'</p>';
    html += '<table><tbody>' +
      '<tr><th style="width:120px">성명</th><td>'+esc(emp.name)+'</td>' +
      '<th style="width:120px">구분</th><td>'+ROLE_LABEL[emp.role]+'</td></tr>' +
      '<tr><th>지급 연월</th><td>'+monthKey+'</td><th>확정일</th><td>' +
        (m.confirmedAt ? new Date(m.confirmedAt).toLocaleDateString('ko-KR') : '-') + '</td></tr>' +
      '</tbody></table>';

    html += '<h2>지급 내역</h2>';
    html += '<table><thead><tr><th>항목</th><th style="width:160px;text-align:right">금액</th></tr></thead><tbody>' +
      payslipRows(pay) +
      '<tr><th>지급 합계</th><td class="num"><strong>'+won(t.preTax)+'</strong></td></tr>' +
      '</tbody></table>';

    html += '<h2>공제 내역</h2>';
    html += '<table><thead><tr><th>항목</th><th style="width:160px;text-align:right">금액</th></tr></thead><tbody>' +
      payslipRows(ded) +
      '<tr><th>공제 합계</th><td class="num"><strong>'+won(t.deduction)+'</strong></td></tr>' +
      '</tbody></table>';
    if (emp.role==='info'){
      html += '<p class="ps-foot">※ 고용보험은 타 사업장에서 가입되어 있어 제외하였으며, 산재보험은 전액 사업주가 부담합니다.</p>';
    }

    html += '<div class="ps-total"><span>실지급액</span><span>'+won(t.net)+'</span></div>';
    html += '<p class="ps-foot">위와 같이 급여를 지급하였음을 확인합니다.<br>M휘트니스</p>';
    return html;
  }

  function printPayslip(emp, m, monthKey){
    var box = document.getElementById('payslip');
    box.innerHTML = buildPayslip(emp, m, monthKey);
    var prevTitle = document.title;
    document.title = monthKey + '_' + emp.name + '_급여명세서';   // 저장 파일명 기본값
    window.print();
    document.title = prevTitle;
  }

  function bindAdmin(){
    document.getElementById('logout-btn').onclick = logout;
    var monthSel = document.getElementById('admin-month');
    if (monthSel) monthSel.onchange = function(e){ UI.month=e.target.value; UI.openEmployeeId=null; render(); };
    var settingsBtn = document.getElementById('admin-settings-btn');
    if (settingsBtn) settingsBtn.onclick = function(){ UI.adminTab='settings'; UI.openEmployeeId=null; render(); };
    var backBtn = document.getElementById('back-btn');
    if (backBtn) backBtn.onclick = function(){ UI.adminTab='list'; UI.openEmployeeId=null; UI.pinErr=''; render(); };

    if (UI.adminTab==='settings'){
      document.getElementById('admin-pin-save').onclick = async function(){
        var cur = document.getElementById('admin-pin-cur').value.trim();
        var next = document.getElementById('admin-pin-new').value.trim();
        var h = await sha256(cur);
        if (h !== STATE.adminPinHash){ UI.pinErr='현재 PIN이 올바르지 않습니다.'; render(); return; }
        if (!next || next.length<4){ UI.pinErr='새 PIN은 4자리 이상.'; render(); return; }
        STATE.adminPinHash = await sha256(next);
        UI.pinErr=''; persist();
      };
      document.querySelectorAll('[data-reset-pin]').forEach(function(b){
        b.onclick = async function(){
          var emp = findEmployee(b.getAttribute('data-reset-pin'));
          emp.pinHash = await sha256('1234');
          persist();
        };
      });
      return;
    }

    document.querySelectorAll('[data-open]').forEach(function(b){
      b.onclick = function(){ UI.openEmployeeId = b.getAttribute('data-open'); render(); };
    });

    if (!UI.openEmployeeId) return;
    var emp = findEmployee(UI.openEmployeeId);
    var m = STATE.months[UI.month][emp.id];
    if (m.status==='confirmed'){
      var reopenBtn = document.getElementById('reopen-btn');
      if (reopenBtn) reopenBtn.onclick = function(){
        reopenWithReason(m, 'confirmed', 'submitted', function(){ m.confirmedAt = null; });
      };
      var payslipBtn = document.getElementById('payslip-btn');
      if (payslipBtn) payslipBtn.onclick = function(){ printPayslip(emp, m, UI.month); };
      return;
    }
    if (m.status==='submitted'){
      var rejectBtn = document.getElementById('reject-btn');
      if (rejectBtn) rejectBtn.onclick = function(){
        reopenWithReason(m, 'submitted', 'draft', function(){ m.submittedAt = null; });
      };
    }

    // 매니저 화면은 본인 화면과 완전히 같은 입력을 씁니다 (관리자는 확정 전까지 계속 수정 가능).
    if (emp.role==='manager'){
      bindManagerPage(emp, m);
      var confirmBtnMg = document.getElementById('confirm-btn');
      if (confirmBtnMg) confirmBtnMg.onclick = function(){
        m.status='confirmed'; m.confirmedAt = new Date().toISOString();
        persist();
      };
      return;
    }

    // 트레이너: 관리자는 세션 표까지 직접 고쳐서 확정 전에 바로잡을 수 있습니다.
    if (emp.role === 'trainer'){
      m.sessions = m.sessions || [];
      document.querySelectorAll('#app-root tbody input[data-f], #app-root tbody select[data-f]').forEach(function(el){
        el.oninput = el.onchange = function(){
          var i = Number(el.getAttribute('data-i'));
          var f = el.getAttribute('data-f');
          m.sessions[i][f] = el.value;
          renderKeepFocus();
        };
      });
      document.querySelectorAll('[data-del]').forEach(function(b){
        b.onclick = function(){ m.sessions.splice(Number(b.getAttribute('data-del')),1); renderKeepFocus(); };
      });
      var addRowBtn = document.getElementById('add-row-btn');
      if (addRowBtn) addRowBtn.onclick = function(){
        m.sessions.push({client:'',category:'신규',contractSessions:'',totalPaid:'',prevDone:'',thisMonthDone:''});
        renderKeepFocus();
      };
    }

    if (emp.role !== 'info'){
      var sa = document.getElementById('support-amount');
      var dr = document.getElementById('deduction-rate');
      if (sa) sa.oninput = function(){ m.supportAmount = Number(sa.value)||0; refreshAdminTotals(emp, m); };
      if (dr) dr.oninput = function(){ m.deductionRate = Number(dr.value)||0; refreshAdminTotals(emp, m); };
    } else {
      var hw = document.getElementById('hourly-wage');
      if (hw) hw.oninput = function(){ m.hourlyWage = Number(hw.value)||0; refreshAdminTotals(emp, m); };
      var pr = document.getElementById('pension-rate');
      if (pr) pr.oninput = function(){ m.pensionRateSelf = Number(pr.value)||0; refreshAdminTotals(emp, m); };
      var hr = document.getElementById('health-rate');
      if (hr) hr.oninput = function(){ m.healthRateTotal = Number(hr.value)||0; refreshAdminTotals(emp, m); };
      var cr2 = document.getElementById('care-rate');
      if (cr2) cr2.oninput = function(){ m.careRateTotal = Number(cr2.value)||0; refreshAdminTotals(emp, m); };
    }
    var confirmBtn = document.getElementById('confirm-btn');
    if (confirmBtn) confirmBtn.onclick = function(){
      m.status='confirmed'; m.confirmedAt = new Date().toISOString();
      persist();
    };
  }

  UI.loginTab = 'employee';
  document.getElementById('app-root').innerHTML =
    '<div class="center"><div class="card login-card"><p class="muted">데이터를 불러오는 중…</p></div></div>';
  connect();
})();
</script>

</body></html>
