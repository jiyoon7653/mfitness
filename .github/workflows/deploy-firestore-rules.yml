name: Firestore 보안 규칙 자동 배포

# firestore.rules 가 바뀌면 Firebase 프로젝트에 자동으로 반영합니다.
# 페이지(Hosting)만 배포하고 규칙을 안 올리면 새 기능이 "권한 없음"으로 막히기 때문에
# 규칙도 같이 자동화해 둡니다.
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 서비스 계정 키를 파일로 저장
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # firebase 명령은 구글이 돌려준 오류 본문을 삼켜서 "403" 만 남깁니다.
      # 배포 전에 같은 API 를 직접 두드려 원인을 로그에 남깁니다.
      - name: 배포 권한 진단
        continue-on-error: true
        env:
          FIREBASE_PROJECT: mfitness-d4a16
        run: node scripts/check-rules-access.mjs

      - name: 규칙 배포
        id: deploy
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project mfitness-d4a16 --non-interactive

      # 서비스 계정에 규칙 배포 권한이 없으면 403 이 납니다(호스팅 배포 권한과 별개입니다).
      - name: 실패했을 때 할 일 안내
        if: failure()
        run: |
          echo "::error::규칙 배포에 실패했습니다. 아래 둘 중 하나로 해결하세요."
          echo ""
          echo "[방법 1 · 지금 바로] Firebase 콘솔에서 직접 게시"
          echo "  https://console.firebase.google.com/project/mfitness-d4a16/firestore/rules"
          echo "  저장소의 firestore.rules 내용을 붙여넣고 '게시'"
          echo ""
          echo "[방법 2 · 다음부터 자동으로] 서비스 계정에 권한 추가 (403 The caller does not have permission 인 경우)"
          echo "  https://console.cloud.google.com/iam-admin/iam?project=mfitness-d4a16"
          echo "  FIREBASE_SERVICE_ACCOUNT 에 넣은 서비스 계정(보통 firebase-adminsdk-...@mfitness-d4a16.iam.gserviceaccount.com)"
          echo "  → 역할 수정 → 'Firebase Rules 관리자'(Firebase Rules Admin) 추가 → 저장"
