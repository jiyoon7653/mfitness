name: 레슨 신규 신청 알림 (텔레그램)

# 개인레슨 신청서가 새로 들어오면 텔레그램으로 알립니다.
#
# 무료(Spark) 요금제에서는 Firestore 에 "문서가 생기면 실행" 같은 방아쇠(Cloud Functions)를
# 쓸 수 없습니다. 그래서 몇 분마다 들여다보고 새 것만 보내는 방식으로 했습니다.
# 공개 저장소라 Actions 실행 시간은 무료이고, 신청 1건당 읽기 몇 번이라 Firestore 무료 한도에도
# 영향이 없습니다. 알림이 너무 잦다고 느껴지면 아래 cron 의 */5 를 */10 이나 */15 로 바꾸세요.
on:
  schedule:
    - cron: '*/5 * * * *'     # 5분마다 (GitHub 사정으로 몇 분 늦을 수 있습니다)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '보내지 않고 내용만 확인 (1 = 미리보기)'
        required: false
        default: '0'

# 같은 시각에 두 번 돌아 같은 신청을 두 번 보내는 일이 없게 합니다.
concurrency:
  group: lesson-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 서비스 계정 키를 파일로 저장
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: 새 신청 확인하고 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_LESSON_CHAT_ID: ${{ secrets.TELEGRAM_LESSON_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/lesson-notify.mjs
